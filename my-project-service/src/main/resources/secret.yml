# ================= 敏感配置（密码等） =================
# 是什么：把密码等敏感信息从 application.yml 里单独抽出来，集中管理。
# 干什么：application.yml 顶部用 spring.config.import 导入本文件，再用 ${secret.xxx} 引用这里的值。
# 为什么：敏感信息集中一处，方便改、方便加进 .gitignore 不入库；真正上线时还能换成环境变量注入。

secret:
  mysql-password: "041119"      # MySQL 密码（0 开头必须加引号，否则 YAML 会把 041119 解析成数字 41119）
  redis-password: "041119"      # Redis 密码
  rabbitmq-password: "041119"   # RabbitMQ 密码
